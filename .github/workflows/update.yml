name: Update news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/films.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch news and posters
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/update.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/live.json)" ]; then
            git config user.name "unmai-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live.json
            git commit -m "Auto-update news $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push
          else
            echo "Nothing new."
          fi
